    summary: "Binary biên dịch trực tiếp ra mã máy gốc (x86/x64). Kết hợp quét tĩnh nhanh (PE-bear, CAPA, FLOSS) trước khi đi sâu vào mã giả trong IDA Pro / Ghidra."
    recommendations:
      - tool_id: pe_bear
        fallback_name: "PE-bear"
        fallback_type: "gui"
