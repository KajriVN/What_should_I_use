      - tool_id: x64dbg
        fallback_name: "x64dbg"
        fallback_type: "gui"
        step: 3
        reason: "Nạp file .map từ IDR vào x32dbg/x64dbg để hiện đầy đủ tên hàm thư viện VCL khi debug."
