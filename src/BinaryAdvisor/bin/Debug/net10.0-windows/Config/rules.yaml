        fallback_name: "IDR (Interactive Delphi Reconstructor)"
        fallback_type: "gui"
        step: 2
        reason: "Trích xuất RTTI, danh sách VCL Forms (nút bấm, sự kiện ButtonClick) và xuất Map file để nạp vào IDA/Ghidra/x64dbg."
        warning: "Đừng dò từ hàm WinMain của Delphi — hãy mở Form Viewer trong IDR để tìm thẳng địa chỉ hàm sự kiện (ví dụ: Button1Click)!"
      - tool_id: ghidra
        fallback_name: "Ghidra"
        fallback_type: "gui"
