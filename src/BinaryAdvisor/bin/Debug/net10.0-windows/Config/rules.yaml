      types: ["Compiler", "Language", "Library", "Linker", "Signature"]
      keywords: ["Delphi", "Embarcadero", "Borland Delphi", "Object Pascal", "Free Pascal", "Lazarus"]
    summary: "Ứng dụng biên dịch bằng Delphi dùng quy ước gọi hàm 'register' (EAX, EDX, ECX) và lưu bố cục giao diện VCL Form (DFM) kèm sự kiện OnClick trong tài nguyên."
    recommendations:
