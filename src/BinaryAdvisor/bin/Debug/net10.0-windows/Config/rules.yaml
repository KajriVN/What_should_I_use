        warning: "Có thể dùng Ghidra thay thế hoàn toàn miễn phí nếu máy chưa có bản quyền IDA Pro."
      - tool_id: ghidra
        fallback_name: "Ghidra"
        fallback_type: "gui"
        step: 2
        reason: "Bộ công cụ dịch ngược mạnh mẽ của NSA với trình Decompiler miễn phí cho cả x86, x64, ARM."
        warning: ""
      - tool_id: x64dbg
        fallback_name: "x64dbg"
        fallback_type: "gui"
        step: 3
        reason: "Gỡ lỗi động từng lệnh hợp ngữ, theo dõi thanh ghi, ngăn xếp và vùng nhớ trong thời gian thực."
        warning: "Với tệp PE32 (32-bit), sử dụng x32dbg để tương thích kiến trúc."

  - id: elf_linux_binary
    title: "Tệp thực thi Linux / Unix (ELF32 / ELF64)"
    priority: 3
    category: "Compiler/Language"
    match:
      file_types: ["ELF", "ELF32", "ELF64"]
    summary: "Đây là tệp thực thi định dạng ELF của Linux (không chạy trực tiếp trên Windows gốc). Dùng Ghidra/IDA trên Windows để phân tích tĩnh và chạy động trong WSL2 hoặc máy ảo Linux."
    recommendations:
      - tool_id: ghidra
        fallback_name: "Ghidra"
        fallback_type: "gui"
        step: 2
        reason: "Phân tích tĩnh hoàn chỉnh cấu trúc ELF32/ELF64, bảng GOT/PLT và tạo mã giả C ngay trên Windows."
        warning: ""
      - tool_id: floss
        fallback_name: "FLOSS"
        fallback_type: "cli"
        step: 2
        reason: "Trích xuất chuỗi ký tự ASCII/UTF-8 nhúng trong các phân vùng .rodata / .data."
        warning: ""
      - tool_id: ida64
        fallback_name: "IDA Pro (64-bit)"
        fallback_type: "gui"
        step: 2
        reason: "Phân tích luồng điều khiển ELF và hỗ trợ Remote Linux Debugger nối tới máy ảo Linux / WSL."
        warning: "Để phân tích động (Bước 3), hãy sử dụng GDB (pwndbg / gef) hoặc strace/ltrace bên trong máy ảo Linux."

# =========================================================================
# BỘ ĐỀ XUẤT KHI BỘ LỌC HEURISTIC PHÁT HIỆN SUSPECTED CUSTOM PACKER
# =========================================================================
heuristic_recommendations:
  - tool_id: pe_bear
    fallback_name: "PE-bear (Soi Header & Overlay)"
    fallback_type: "gui"
    step: 1
    reason: "Entropy bất thường (> 7.2) hoặc Section bị đánh dấu nén nhưng không khớp chữ ký Packer phổ thông. Dùng PE-bear kiểm tra Section bất thường, RawSize vs VirtualSize và vùng Overlay cuối file."
    warning: "Kiểm tra xem có phải UPX đã bị xóa chữ ký 'UPX!' ở đầu file để qua mặt trình quét tĩnh hay không!"
  - tool_id: floss
    fallback_name: "FLOSS (Giải mã chuỗi ẩn)"
    fallback_type: "cli"
    step: 1
    reason: "Tự động mô phỏng mã máy để giải mã các Stack Strings, Tight Strings và chuỗi bị mã hóa XOR/RC4 đơn giản."
    warning: ""
  - tool_id: capa
    fallback_name: "CAPA (Dò stub giải nén)"
    fallback_type: "cli"
    step: 2
    reason: "Nhận diện thuật toán giải mã/giải nén (AES, RC4, ChaCha20, LZMA, aPLib) hoặc kỹ thuật cấp phát vùng nhớ thực thi trong stub."
    warning: ""
  - tool_id: x64dbg
    fallback_name: "x64dbg (Unpack động qua API Breakpoint)"
    fallback_type: "gui"
    step: 3
    reason: "Đặt Breakpoint tại VirtualAlloc, VirtualProtect, WriteProcessMemory hoặc NtMapViewOfSection để bắt trọn payload thực ngay khi Custom Packer giải mã vào RAM."
    warning: "CẢNH BÁO CAO: Custom Packer rất phổ biến ở Malware / Ransomware — bắt buộc phân tích động trong Máy ảo (VM) đã cô lập hoàn toàn!"

