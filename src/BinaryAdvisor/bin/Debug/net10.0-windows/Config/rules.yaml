        fallback_name: "CAPA"
        fallback_type: "cli"
        step: 2
        reason: "Liệt kê tự động các hành vi kỹ thuật (MITRE ATT&CK, mã hóa, kết nối mạng, thao tác tiến trình) chỉ trong vài giây."
