      keywords: ["Visual Basic 5.0", "Visual Basic 6.0", "MSVBVM60", "VB5!", "VB6"]
    summary: "Ứng dụng VB6 có thể biên dịch ở chế độ Native Code hoặc P-Code (bytecode chạy bởi MSVBVM60.DLL). IDA/Ghidra thông thường không đọc được P-Code!"
    recommendations:
      - tool_id: vb_decompiler
        fallback_name: "VB Decompiler"
        fallback_type: "gui"
        step: 2
        reason: "Công cụ chuyên biệt đọc cấu trúc VBHeader, khôi phục Form và dịch ngược cả VB6 P-Code lẫn Native API."
        warning: "Nếu biên dịch ở chế độ P-Code, mở trong x32dbg bạn chỉ thấy vòng lặp máy ảo trong MSVBVM60.DLL."
